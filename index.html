<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello from GitHub Pages</title>
  <script type="module" src="/src/main.js"></script>
</head>
<body class="min-h-screen bg-gray-950 text-white flex items-center justify-center">
  <div class="text-center px-6">
    <div class="inline-flex items-center gap-2 bg-green-500/10 text-green-400 border border-green-500/20 rounded-full px-4 py-1.5 text-sm font-medium mb-8">
      <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
      Live on GitHub Pages
    </div>

    <h1 class="text-5xl font-bold tracking-tight mb-4">
      Hello, <span class="text-indigo-400">GitHub Pages!</span>
    </h1>

    <p class="text-gray-400 text-lg max-w-md mx-auto mb-10">
      A Tailwind CSS + Vite project served from
      <code class="text-indigo-300 bg-indigo-500/10 px-1.5 py-0.5 rounded text-sm">Theojkydbz/testtest</code>
    </p>

    <div class="flex flex-wrap justify-center gap-3">
      <span class="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm text-gray-300">Tailwind CSS v4</span>
      <span class="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm text-gray-300">Vite v6</span>
      <span class="px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm text-gray-300">GitHub Actions</span>
    </div>
  </div>
</body>
</html>
