<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello from GitHub Pages</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      color: #e6edf3;
      font-size: 2.5rem;
      margin: 0 0 1rem;
    }
    p {
      color: #8b949e;
      font-size: 1.1rem;
      margin: 0;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.4rem 1rem;
      background: #238636;
      color: #fff;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, GitHub Pages!</h1>
    <p>This page is served from <strong>Theojkydbz/testtest</strong></p>
    <div class="badge">Live on theojkydbz.github.io/testtest</div>
  </div>
</body>
</html>
